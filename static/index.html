<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wazobia AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; }
    #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
    .msg { margin: 5px 0; }
    .user { color: #0066cc; }
    .bot { color: #009900; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Wazobia AI</h2>

    <!-- Login Section -->
    <div id="login-section">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="login-btn">Login</button>
      <p id="login-error" style="color:red;"></p>
    </div>

    <!-- Chat Section -->
    <div id="chat-section" class="hidden">
      <div id="chat-box"></div>
      <input id="chat-input" type="text" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
      <button id="logout-btn" style="margin-top:10px;">Logout</button>
    </div>
  </div>

  <script>
    const API_BASE = ""; // same origin

    let token = null;
    let userId = "user-" + Math.random().toString(36).slice(2, 8);

    const loginSection = document.getElementById("login-section");
    const chatSection = document.getElementById("chat-section");
    const loginError = document.getElementById("login-error");
    const chatBox = document.getElementById("chat-box");
    const chatInput = document.getElementById("chat-input");

    document.getElementById("login-btn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      loginError.textContent = "";

      try {
        const res = await fetch(API_BASE + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");
        token = data.token;
        loginSection.classList.add("hidden");
        chatSection.classList.remove("hidden");
      } catch (e) {
        loginError.textContent = e.message;
      }
    };

    document.getElementById("logout-btn").onclick = () => {
      token = null;
      chatBox.innerHTML = "";
      chatSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
    };

    document.getElementById("send-btn").onclick = async () => {
      const message = chatInput.value.trim();
      if (!message) return;
      chatInput.value = "";

      // Show user message
      chatBox.innerHTML += `<div class="msg user"><strong>You:</strong> ${escapeHtml(message)}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(API_BASE + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, user_id: userId }),
        });
        const data = await res.json();
        chatBox.innerHTML += `<div class="msg bot"><strong>Bot:</strong> ${escapeHtml(data.reply)}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        chatBox.innerHTML += `<div class="msg bot" style="color:red;">Error: ${e.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    };

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
